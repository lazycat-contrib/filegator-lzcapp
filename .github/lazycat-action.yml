version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/filegator.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: filegator

build:
  run_buildscript: false

images:
  # 主应用：上游有完整三段 SemVer tag 家族（v7.x.y），排除 -multiarch/latest/demo
  - id: filegator
    target: service
    service: filegator
    source: filegator/filegator
    channel: stable
    sort: semver
    tag_regex: '^v\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: FileGator
    summary: "功能强大的多用户文件管理器"
